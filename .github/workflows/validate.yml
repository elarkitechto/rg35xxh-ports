name: Validate public source
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/check-public-tree.sh
      - run: sh -n ports/crossyroad/portmaster/'Crossy Road.sh' ports/crossyroad/portmaster/crossyroad/install-data ports/crossyroad/source/build_native.sh tools/build-crossyroad-local.sh
      - run: python3 -m json.tool ports/crossyroad/portmaster/port.json >/dev/null
      - run: python3 -m py_compile ports/crossyroad/source/patch_loader_sdl.py
      - run: sh -n tools/build-alto-local.sh && sh -n ports/altosadventure/source/build.sh && sh -n ports/altosadventure/portmaster/altosadventure/install-data
      - run: bash -n "ports/altosadventure/portmaster/Alto's Adventure.sh"
      - run: python3 -m json.tool ports/altosadventure/portmaster/port.json >/dev/null
      - run: python3 -c "import xml.etree.ElementTree as E; E.parse('ports/altosadventure/portmaster/gameinfo.xml')"
      - run: python3 -m py_compile tools/validate-port-media.py
      - run: python3 ports/altosadventure/tests/test_launcher.py
      - run: sh -n ports/crossyroad/source/build_all.sh
      - run: python3 ports/crossyroad/tests/test_launcher.py
      - run: bash -n 'ports/threes/portmaster/Threes!.sh'
      - run: sh -n ports/threes/source/build.sh ports/threes/portmaster/threes/install-data tools/build-threes-local.sh
      - run: python3 -m json.tool ports/threes/portmaster/port.json >/dev/null
      - run: python3 -c "import xml.etree.ElementTree as E; E.parse('ports/threes/portmaster/gameinfo.xml')"
      - run: python3 ports/threes/tests/test_install.py
      - run: python3 ports/threes/tests/test_launcher.py
